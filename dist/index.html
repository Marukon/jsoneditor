<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>JSON 左右对比（正确版）</title>

  <link rel="stylesheet" href="./jsoneditor.min.css" />

  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI";
    }

    header {
      height: 46px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 12px;
      background: #1f2937;
      color: #fff;
    }

    header button {
      height: 28px;
      padding: 0 10px;
      border: none;
      border-radius: 4px;
      background: #3b82f6;
      color: #fff;
      cursor: pointer;
    }

    #main {
      height: calc(100% - 46px);
      display: flex;
    }

    .editor {
      width: 50%;
      height: 100%;
    }
  </style>
</head>
<body>

<header>
  <strong>JSON 左右对比</strong>
  <button onclick="swap()">左右互换</button>
  <button onclick="copy(leftEditor)">复制左侧</button>
  <button onclick="copy(rightEditor)">复制右侧</button>
</header>

<div id="main">
  <div id="left" class="editor"></div>
  <div id="right" class="editor"></div>
</div>

<script src="./jsoneditor.min.js"></script>
<script>
  const leftContainer = document.getElementById('left')
  const rightContainer = document.getElementById('right')

  const options = {
    mode: 'tree',
    modes: ['tree', 'code', 'text'],
    search: true,
    history: true
  }

  const leftEditor = new JSONEditor(leftContainer, options)
  const rightEditor = new JSONEditor(rightContainer, options)

  // 初始化数据
  leftEditor.set({
    name: "config",
    enabled: true,
    timeout: 30
  })

  rightEditor.set({
    name: "config",
    enabled: false,
    timeout: 60,
    extra: "new"
  })

  // 差异高亮（官方方式）
  JSONEditor.diff(leftEditor, rightEditor)

  function swap() {
    const l = leftEditor.get()
    const r = rightEditor.get()
    leftEditor.set(r)
    rightEditor.set(l)
  }

  function copy(editor) {
    try {
      const json = editor.get()
      navigator.clipboard.writeText(JSON.stringify(json, null, 2))
      alert('已复制')
    } catch (e) {
      alert('复制失败')
    }
  }
</script>

</body>
</html>
